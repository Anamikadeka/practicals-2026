<!-- Implement a form with input fields for name, email, and a submit button.-->
<!DOCTYPEhtml>
<htmllang="en">
<head>
    <metacharset="UTF-8">
    <metaname="viewport"content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
           table , th, td {border: 1pxsolidblack;border-collapse: collapse; padding: 5px }
    </style>
   
</head>
<body>
    <formclass="my-form">
    <table>
        <tr>
            <th><labelfor="fname">First Name</label></th>
            <th><inputtype="text"id="fname"placeholder="required"><br><br></th>
        </tr>
        <tr>
            <th><labelfor="lname">Last Name</label></th>
            <th><inputtype="text"id="lname"placeholder="required"><br><br></th>
        </tr>
        <tr>
            <th><labelfor="email">Email address</label></th>
            <th><inputtype="text"id="email"placeholder="abcd123@gmail.com"><br><br></th>
        </tr>
    </table>
        <buttonid="submit">Submit</button>
    </form>
</body>
</html>
