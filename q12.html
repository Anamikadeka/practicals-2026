<!DOCTYPE html>
<html>
<head>
    <title>Alternate Rows colors</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }
        th,td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: lightgreen;
        }
        tr:nth-child(odd){
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <h2>Student Details</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Hrishikesh</td>
            <td>Mca</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Anu</td>
            <td>Bsc</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Riyan</td>
            <td>Bsc</td>
            <td>88</td>
        </tr>
    </table>
</body>
</html>
