<!DOCTYPE html>
<html lang="en">
<head>
    <title>Styled Input Field</title>
    <style>
        input{
            border: rgb(164, 224, 248);
            padding: 10px;
            background-color: blueviolet;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h2>Styled From Input</h2>

    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name">
</body>
</html>
