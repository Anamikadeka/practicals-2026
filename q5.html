<!DOCTYPEhtml>
<htmllang="en">
<head>
    <metacharset="UTF-8">
    <metaname="viewport"content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <linkrel="stylesheet"href="style.css">
</head>
<body>
    <headerclass="gallery-header">
        <h1>Our Visual Gallery</h1>
        <p>A beautiful collection of modern photography</p>
    </header>
    <mainclass="gallery-container">
        <!-- Gallery Item 1 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Scenic mountain range under cloudy sky">
            <figcaptionclass="gallery-caption">Mountain Adventure</figcaption>
        </figure>
        <!-- Gallery Item 2 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Calm ocean waves at sunset">
            <figcaptionclass="gallery-caption">Serene Ocean</figcaption>
        </figure>
        <!-- Gallery Item 3 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Lush green forest path">
            <figcaptionclass="gallery-caption">Forest Pathway</figcaption>
        </figure>
        <!-- Gallery Item 4 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Sprawling neon lights city skyline">
            <figcaptionclass="gallery-caption">City Neon Lights</figcaption>
        </figure>
        <!-- Gallery Item 5 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Golden desert sand dunes">
            <figcaptionclass="gallery-caption">Desert Dunes</figcaption>
        </figure>
        <!-- Gallery Item 6 -->
        <figureclass="gallery-item">
            <imgsrc="https://picsum.photos"alt="Close-up of fresh morning dew drops on a leaf">
            <figcaptionclass="gallery-caption">Morning Dew</figcaption>
        </figure>
    </main>
</body>
</html>
