<!DOCTYPEhtml>
<htmllang="en">
<head>
    <style>
    .tooltip {
        position: relative;
        display: inline-block;
        border-bottom: 1pxdottedblack;
        cursor: pointer;
    }
    .tooltiptext {
        visibility: hidden;
        width: 130px;
        background-color: black;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px0;
        position: absolute;
        z-index: 1;
    }
    .tooltip:hover.tooltiptext {
      visibility: visible;
    }
    </style>
</head>
<body>  
    <h2>Basic CSS Tooltip Code</h2>
    <p>Move the mouse over the text below:</p>
    <divclass="tooltip">Hover over me
       <spanclass="tooltiptext">Some tooltip text</span>
    </div>
</body>
