<!DOCTYPE html>
<html lang="en">
<head>
   <title>Button Hover Effect</title>
   <style>
    button{
        background-color: blue;
        color: rgb(222, 23, 89);
        padding: 25px 30px;
        border: 2px solid rgb(107, 19, 222);
        cursor: pointer;
    }
    button:hover{
        background-color: rgb(90, 241, 44);
        color: aqua;
        border: 2px solid rgb(255, 0, 68);
    }
   </style>
</head>
<body>
    <button>Submit</button>
</body>
</html>
